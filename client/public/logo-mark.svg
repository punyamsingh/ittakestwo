<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 206 122" role="img" aria-label="Tetherlings">
  <defs>
    <radialGradient id="tl-pink" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffd8ea"/>
      <stop offset="0.55" stop-color="#ff8fbf"/>
      <stop offset="1" stop-color="#e2578f"/>
    </radialGradient>
    <radialGradient id="tl-gold" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff5c8"/>
      <stop offset="0.55" stop-color="#ffcf66"/>
      <stop offset="1" stop-color="#f09a3e"/>
    </radialGradient>
    <linearGradient id="tl-link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset="1" stop-color="#e8a948"/>
    </linearGradient>
    <g id="link">
      <rect x="-11" y="-6.5" width="22" height="13" rx="6.5" fill="none" stroke="#3a1a4f" stroke-width="10"/>
      <rect x="-11" y="-6.5" width="22" height="13" rx="6.5" fill="none" stroke="url(#tl-link)" stroke-width="4.5"/>
    </g>
  </defs>

  <!-- ground shadows -->
  <ellipse cx="44" cy="104" rx="30" ry="5" fill="#2a1240" opacity="0.25"/>
  <ellipse cx="152" cy="104" rx="16" ry="3.5" fill="#2a1240" opacity="0.18"/>

  <!-- taut chain, pink's paw (72,62) to gold's paw (128,42) -->
  <g transform="translate(100 52) rotate(-19.6)">
    <use href="#link" x="-24"/>
    <use href="#link" x="0" transform="rotate(90 0 0) scale(0.55 1)"/>
    <use href="#link" x="24"/>
    <path d="M-10 -12 L-4 -16 M10 12 L4 16" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- motion lines under the jumper -->
  <g stroke="#b98bff" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <path d="M140 86 L136 98"/>
    <path d="M152 88 L152 101"/>
    <path d="M164 86 L168 98"/>
  </g>

  <!-- pink: leaning back, tugging -->
  <g transform="rotate(-14 44 70)">
    <path d="M44 22 C40 14 46 8 52 12" fill="none" stroke="#3a1a4f" stroke-width="9" stroke-linecap="round"/>
    <path d="M44 22 C40 14 46 8 52 12" fill="none" stroke="#7ee8c8" stroke-width="4" stroke-linecap="round"/>
    <!-- feet -->
    <ellipse cx="30" cy="100" rx="11" ry="6" fill="#e2578f" stroke="#3a1a4f" stroke-width="4"/>
    <ellipse cx="58" cy="100" rx="11" ry="6" fill="#e2578f" stroke="#3a1a4f" stroke-width="4"/>
    <path d="M44 24 C68 24 76 46 76 66 C76 86 62 98 44 98 C26 98 12 86 12 66 C12 46 20 24 44 24 Z" fill="url(#tl-pink)" stroke="#3a1a4f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="31" cy="40" rx="8" ry="5" fill="#fff" opacity="0.55" transform="rotate(-25 31 40)"/>
    <!-- straining > < eyes -->
    <path d="M28 56 L36 60 L28 64" fill="none" stroke="#2a1240" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 56 L52 60 L60 64" fill="none" stroke="#2a1240" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="25" cy="72" rx="5" ry="3" fill="#ff5f9b" opacity="0.6"/>
    <ellipse cx="63" cy="72" rx="5" ry="3" fill="#ff5f9b" opacity="0.6"/>
    <!-- gritted grin -->
    <path d="M34 70 Q44 80 54 70 Z" fill="#fff" stroke="#3a1a4f" stroke-width="3" stroke-linejoin="round"/>
    <!-- paw gripping the chain -->
    <ellipse cx="77" cy="66" rx="8" ry="7" fill="url(#tl-pink)" stroke="#3a1a4f" stroke-width="4"/>
    <!-- sweat drop -->
    <path d="M14 38 C10 44 11 49 15 49 C19 49 19 44 14 38 Z" fill="#9fe8ff" stroke="#3a1a4f" stroke-width="2.5"/>
  </g>

  <!-- gold: mid-bounce, stretched, thrilled -->
  <g transform="translate(152 46) rotate(12) scale(0.92 1.08) translate(-152 -46)">
    <path d="M144 11 L140 1 L149 8 L153 -2 L157 8 L165 2 L161 12" fill="#ff8fbf" stroke="#3a1a4f" stroke-width="4" stroke-linejoin="round"/>
    <!-- arms up -->
    <ellipse cx="127" cy="40" rx="7.5" ry="7" fill="url(#tl-gold)" stroke="#3a1a4f" stroke-width="4"/>
    <ellipse cx="180" cy="26" rx="7.5" ry="7" fill="url(#tl-gold)" stroke="#3a1a4f" stroke-width="4"/>
    <path d="M152 12 C174 12 182 30 182 48 C182 66 168 78 152 78 C136 78 122 66 122 48 C122 30 130 12 152 12 Z" fill="url(#tl-gold)" stroke="#3a1a4f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="140" cy="27" rx="8" ry="5" fill="#fff" opacity="0.6" transform="rotate(-25 140 27)"/>
    <!-- sparkly eyes -->
    <ellipse cx="142" cy="44" rx="6.5" ry="8" fill="#fff" stroke="#3a1a4f" stroke-width="2.5"/>
    <ellipse cx="162" cy="44" rx="6.5" ry="8" fill="#fff" stroke="#3a1a4f" stroke-width="2.5"/>
    <circle cx="142" cy="45" r="4.2" fill="#2a1240"/>
    <circle cx="162" cy="45" r="4.2" fill="#2a1240"/>
    <circle cx="143.6" cy="43" r="1.6" fill="#fff"/>
    <circle cx="163.6" cy="43" r="1.6" fill="#fff"/>
    <circle cx="140.8" cy="47.4" r="0.9" fill="#fff"/>
    <circle cx="160.8" cy="47.4" r="0.9" fill="#fff"/>
    <ellipse cx="134" cy="56" rx="5" ry="3" fill="#ff7a6b" opacity="0.55"/>
    <ellipse cx="170" cy="56" rx="5" ry="3" fill="#ff7a6b" opacity="0.55"/>
    <!-- open "wheee" mouth -->
    <path d="M144 56 Q152 70 160 56 Z" fill="#8a2345" stroke="#3a1a4f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M147.5 61.5 Q152 66 156.5 61.5" fill="#ff8fa8"/>
  </g>

  <!-- sparkles -->
  <path d="M190 58 L192.5 64 L198 66 L192.5 68 L190 74 L187.5 68 L182 66 L187.5 64 Z" fill="#fff3b0" stroke="#3a1a4f" stroke-width="2"/>
  <path d="M112 12 L113.8 16.5 L118 18 L113.8 19.5 L112 24 L110.2 19.5 L106 18 L110.2 16.5 Z" fill="#fff" stroke="#3a1a4f" stroke-width="2"/>
</svg>
